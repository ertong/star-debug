# Keep Flutter's correctness checks; allow the styles used in handwritten code.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated output: change the sources and regenerate instead.
    - '**/*.g.dart'
    - '**/*.i18n.dart'
    - '**/*.pb.dart'
    - '**/*.pbenum.dart'
    - '**/*.pbjson.dart'
    - '**/*.pbgrpc.dart'
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  # Rule reference: https://dart.dev/tools/linter-rules
  rules:
    # Short guards and branches often omit braces.
    curly_braces_in_flow_control_structures: false

    # Explicit types, var/final, and this. are all used intentionally.
    omit_local_variable_types: false
    prefer_final_locals: false
    unnecessary_this: false


    # Keep existing logging tags (_TAG, TAG, R) and external-style member names.
    constant_identifier_names: false
    non_constant_identifier_names: false

    empty_constructor_bodies: false

    # Allow explicit interpolation, grouping, and default argument values.
    unnecessary_string_interpolations: false
    unnecessary_parenthesis: false
    avoid_redundant_argument_values: false

    uplink_throughput_bps: Uplink Throughput
    pop_ping_drop_rate: PoP ping drop rate
    pop_ping_latency_ms: PoP ping затримка
    pop_ping__hint: 'Мережа Starlink, грубо кажучи, складається з таких компонентів:

      - Користувацькі термінали (UT)

      - Супутники (SAT)

      - Наземні станції (які фізично з''єднуються з супутниками)

      - Точки присутності (PoP) (що з''єднуються наемними станціями через оптоволокно
      та маршрутизують мережевий трафік в Інтернет)


      **PoP Ping Latency** вказує на час, необхідний для передачі пакета з користувацького
      терміналу до точки присутності і назад.


      **PoP Ping Drop Rate** вказує на частку пакетів, які втрачаються під час передачі
      між користувацьким терміналом та точкою присутності.

      '
    stow_requested: Складання в процесі
    stow_requested__hint: Чи було надіслано команду складання. У складеному стані
      тарілка згортається для зберігання або транспортування.
    boresight_azimuth_deg: Азимут осі панелі, град
    boresight_azimuth_deg__hint: Горизонтальний кут компасу, в якому наразі спрямована
      антенна панель тарілки, в градусах.
    boresight_elevation_deg: Кут підйому панелі, град
    boresight_elevation_deg__hint: Вертикальний кут, під яким наразі спрямована антенна
      панель тарілки відносно горизонту, в градусах.
    eth_speed_mbps: Швидкість Ethernet, Mbps
    mobility_class: Клас мобільності
    mobility_class__hint: 'Можливі варіанти:


      - **STATIONARY** - Тарілка встановлена на фіксованому місці (домашнє використання).

      - **NOMADIC** - Тарілку можна переміщувати між локаціями, але не використовувати
      під час руху.

      - **MOBILE** - Тарілка використовується під час руху (човни, будинки на колесах
      тощо).

      '
    is_snr_above_noise_floor: SNR вище за рівень шуму
    is_snr_above_noise_floor__hint: Чи перевищує відношення сигнал/шум мінімальний
      поріг, необхідний для надійного зв'язку.
    class_of_service: Клас сервісу
    class_of_service__hint: 'Можливі варіанти:


      - **UNKNOWN**

      - **CONSUMER** - Домашній план Starlink.

      - **BUSINESS** - План Starlink Business.

      - **BUSINESS_PLUS** - План Starlink Business Plus з підвищеним пріоритетом.

      - **COMMERCIAL_AVIATION** - Авіаційний план Starlink для комерційних літаків.

      '
    software_update_state: Стан оновлення
    software_update_state__hint: 'Можливі варіанти:


      - **UNKNOWN**

      - **IDLE** - Оновлення не виконується.

      - **FETCHING** - Завантаження нового оновлення.

      - **PRE_CHECK** - Виконання перевірок перед оновленням.

      - **WRITING** - Запис оновлення на розділ.

      - **POST_CHECK** - Перевірка після оновлення.

      - **REBOOT_REQUIRED** - Оновлення готове, потрібне перезавантаження.

      - **DISABLED** - Оновлення вимкнено.

      - **FAULTED** - Помилка процесу оновлення.

      '
    is_snr_persistently_low: SNR стабільно низький
    is_snr_persistently_low__hint: Чи було відношення сигнал/шум стабільно нижче допустимого
      рівня. Може вказувати на перешкоди або проблеми з обладнанням.
    has_actuators: Наявність приводу
    has_actuators__hint: Чи має тарілка моторизовані приводи для нахилу та обертання.
    actuator_state: Стан приводів
    actuator_state__hint: 'Можливі варіанти:


      - **IDLE** - Приводи в стані спокою, тарілка в нормальній робочій позиції.

      - **FULL_TILT** - Тарілка повністю нахилена.

      - **ROTATE** - Тарілка обертається.

      - **TILT** - Тарілка нахиляється.

      - **UNWRAP_POSITIVE** - Тарілка розмотує кабелі в позитивному напрямку.

      - **UNWRAP_NEGATIVE** - Тарілка розмотує кабелі в негативному напрямку.

      - **TILT_TO_STOWED** - Тарілка нахиляється в складене (плоске) положення.

      - **FAULTED** - Привід несправний, потребує уваги.

      - **WAIT_TIL_STATIC** - Очікування, поки тарілка стане нерухомою.

      - **DRIVE_TO_MOBILE_POSITION** - Переміщення в мобільну робочу позицію.

      - **MOBILE_WAIT** - Очікування в мобільному режимі.

      '
    disablement_code: Стан сервісу
    disablement_code__hint: 'Можливі варіанти:


      - **UNKNOWN_STATE**

      - **OKAY** - Сервіс працює нормально.

      - **NO_ACTIVE_ACCOUNT** - Немає активного облікового запису Starlink для цієї
      тарілки.

      - **TOO_FAR_FROM_SERVICE_ADDRESS** - Тарілка занадто далеко від зареєстрованої
      адреси обслуговування.

      - **IN_OCEAN** - Розташування тарілки визначено як океан.

      - **BLOCKED_COUNTRY** - Сервіс Starlink недоступний у цій країні.

      - **DATA_OVERAGE_SANDBOX_POLICY** - Ліміт даних перевищено.

      - **CELL_IS_DISABLED** - Стільник Starlink, що обслуговує цю зону, вимкнено.

      - **ROAM_RESTRICTED** - Роумінг обмежений для цього плану або місця.

      - **UNKNOWN_LOCATION** - Тарілка не може визначити своє місцезнаходження.

      - **ACCOUNT_DISABLED** - Обліковий запис Starlink вимкнено.

      - **UNSUPPORTED_VERSION** - Версія прошивки тарілки більше не підтримується.

      - **MOVING_TOO_FAST_FOR_POLICY** - Тарілка рухається швидше, ніж дозволено планом
      обслуговування.

      - **UNDER_AVIATION_FLYOVER_LIMITS** - Нижче авіаційних обмежень висоти прольоту.

      - **BLOCKED_AREA** - Тарілка знаходиться в обмеженій або заблокованій зоні.

      - **OUTSIDE_HOME_REGION** - Обслуговування обмежено, оскільки тарілка перебуває
      поза домашнім регіоном.

      '
    reboot_reason: Причина перезавантаження
    reboot_reason__hint: 'Можливі варіанти:


      - **NONE**

      - **MANUAL** - Перезавантаження ініційоване користувачем вручну.

      - **LOSS_OF_COMM** - Перезавантаження через втрату зв''язку з мережею.

      - **SWUPDATE_NOW** - Негайне перезавантаження для оновлення.

      - **SWUPDATE_SCHEDULED** - Заплановане перезавантаження для оновлення.

      - **APP** - Перезавантаження через додаток Starlink.

      - **EMC** - Перезавантаження через підсистему EMC.

      - **FACTORY_RESET** - Перезавантаження після скидання до заводських налаштувань.

      - **TEST_CASE** - Перезавантаження через тестовий сценарій.

      - **THERMAL_POWER_CUT** - Перезавантаження через захист від перегріву.

      - **CRITICAL_PROCESS_DIED** - Критичний процес завершився аварійно.

      - **NO_RF_READY** - RF front end не вдалося ініціалізувати.

      - **POSTPONED_LOSS_OF_COMM** - Відкладене перезавантаження після втрати зв''язку.

      - **SWUPDATE_STATIONARY** - Оновлення прошивки в стаціонарному режимі.

      - **AAP_CRASH** - Збій цифрового формувача променя (AAP).

      - **XP70_SACS** - Збій підсистеми XP70 SACS.

      - **INE_FAILED** - Помилка початкового входу в мережу.

      - **KERNEL_TAINTED** - Ядро було забруднене (наприклад, помилка модуля).

      - **MINI2_AUTO_OFF** - Застаріла причина автоматичного вимкнення.

      - **BATTERY_AUTO_OFF** - Автоматичне вимкнення, пов''язане з роботою від акумулятора.

      '

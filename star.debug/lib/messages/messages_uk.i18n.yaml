  not_found: Не знайдено
  hint: "Перевіряє, чи BSSID (MAC-адреса бездротового інтерфейсу) маршрутизатора знайдена\
    \ в базах даних від Valkyrie.\n\nМожливі варіанти:\n\n - **Знайдено** - BSSID\
    \ знайдена в базі даних Valkyrie. Це означає, що місцезнаходження роутера може\
    \ бути опубліковане в Інтернеті.\n - **Не знайдено** - BSSID не знайдено в базі\
    \ даних Valkyrie ... принаймні поки що.\n\nУ будь-якому випадку, рекомендовано\
    \ регулярно змінювати BSSID у роутерів, для яких безпека є важливою.\nЯкщо цього\
    \ не робити, можливо, це допоможе виявити місцезнаходження підключених пристроїв.\n\
    Крім того, у випадку рухомого маршрутизатора, можна прослідкувати його маршрут.\n"

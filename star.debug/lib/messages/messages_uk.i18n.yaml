  top_left: Ліворуч угорі
  reading_map: Як читати цю карту
  explanation: Кольори показують сигнал, зафіксований під час з’єднань із супутниками
    з плином часу. Синій — добрий сигнал, червоний — сигналу немає. Проміжні відтінки
    між червоним, бурштиновим і синім означають слабкий сигнал. Сірий означає відсутність
    придатних спостережень, а не перешкоду.
  exclusion_hint: Смуга без спостережень може бути зоною геостаціонарного виключення,
    де Starlink не передає й не приймає сигнал, щоб уникнути завад. Інші прогалини можуть
    відповідати напрямкам, які антена ще не спостерігала.
  patterns_hint: Стійкі ділянки без сигналу можуть допомогти порівняти місця встановлення.
    Сама карта не визначає причину відсутності сигналу й не прогнозує перерви. Starlink
    може перемикатися на супутники у вільних напрямках, коли вони доступні.
  patch_hint: Ділянка об’єднує комірки без сигналу зі спільним ребром. Їхня кількість
    не визначає розмір фізичної перешкоди. Відсотки карти й секторів не відповідають
    однаковим площам неба.
  dish_fraction_hint: Цю частку окремо повідомляє антена. Її розрахунок може відрізнятися
    від відсотка заблокованих комірок карти.
  orientation_hint: 'Азимут відлічується за годинниковою стрілкою від географічної півночі
    (0°); схід — 90°. Кут піднесення відлічується від горизонту: 0° — горизонтально,
    90° — вертикально вгору. Цільові кути — бажана орієнтація за даними антени. Різниці
    — цільовий кут мінус кут антени; різниця азимутів у межах ±180°.'
  reception_hint: Час отримання стосується відповідей із картою та станом, а не окремих
    спостережень у накопиченій карті.
  collection_hint: Карта заповнюється під час зв’язку антени із супутниками та продовжує
    оновлюватися. Початковий збір може тривати годинами; самі прогалини не свідчать
    про перешкоду.

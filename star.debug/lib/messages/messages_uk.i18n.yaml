    x_timezone: Часова зона
  BootInfo:
    last_reason: Остання причина
    last_reason__hint: 'Можливі варіанти:


      - **UNKNOWN**

      - **FORGOTTEN** - Причину завантаження не зафіксовано.

      - **POWER_CYCLE** - Пристрій було вимкнено та увімкнено.

      - **COMMAND** - Перезавантаження за командою.

      - **SOFTWARE_UPDATE** - Перезавантаження після оновлення прошивки.

      - **CONFIG_UPDATE** - Перезавантаження після зміни конфігурації.

      - **UPTIME_FDIR** - Перезавантаження через виявлення помилки uptime.

      - **REPEATER_FDIR** - Перезавантаження через виявлення помилки ретранслятора.

      - **AVIATION_ETH_WAN_FDIR** - Перезавантаження через помилку авіаційного Ethernet
      WAN.

      - **KERNEL_PANIC** - Перезавантаження через kernel panic.

      - **MCU_BRINGUP_FAILED_FDIR** - Перезавантаження через помилку ініціалізації
      MCU.

      - **AVIATION_OUTAGE_FDIR** - Перезавантаження через авіаційний збій.

      - **SOFTWARE_WATCHDOG** - Перезавантаження через програмний watchdog.

      - **INTENTIONAL_KERNEL_PANIC** - Навмисний kernel panic для діагностики.

      - **HARDWARE_WATCHDOG** - Перезавантаження через апаратний watchdog.

      - **REPEATER_UNTRUSTED_FDIR** - Перезавантаження через ненадійний ретранслятор.

      '
  DishOutage:
    cause: Причина
    cause__hint: "Причина, чому тарілка не на зв'язку. Можливі варіанти:\n\n- **UNKNOWN**\n\
      - **BOOTING** - Тарілка намагається ініціалізувати з'єднання з супутниками.\n\
      \  Не повинно висіти в такому стані занадто довго. Найбільше часу, зазвичай,\
      \ займає пошук GPS.\n- **STOWED** - Тарілка складена для упаковки та зберігання.\n\
      - **THERMAL_SHUTDOWN** - Тарілка перегріта. В режимі очікування до зниження\
      \ температури.\n- **NO_SCHEDULE**\n- **NO_SATS** - Немає GPS сигналу.\n- **OBSTRUCTED**\
      \ - Забагато перешкод. Переконайтеся, що антена має кут огляду неба 140°\n \
      \  (принаймні в тій частині, куди вона зазвичай орієнтована).\n- **NO_DOWNLINK**\
      \ - Канал передачі даних з супутників не ініціалізовано.\n- **NO_PINGS** - Тарілка\
      \ не отримує пінгів від мережі.\n- **ACTUATOR_ACTIVITY** - Приводи тарілки рухаються\
      \ (нахил або обертання).\n- **CABLE_TEST** - Тарілка виконує тест кабелю.\n\
      - **SLEEPING** - Тарілка в режимі сну (енергозбереження).\n- **SKY_SEARCH**\
      \ - Тарілка шукає супутники в небі.\n"
    start_timestamp_ns: Start timestamp, ns
    duration_ns: Duration, ns
    did_switch: Did switch
  DishGpsStats:
    gps_valid: GPS дійсний
    gps_valid__hint: Чи отримала тарілка дійсний GPS-фікс.
    gps_sats: GPS супутники
    gps_sats__hint: Кількість GPS-супутників, які наразі бачить тарілка.
    no_sats_after_ttff: Немає супутників після першого фіксу
    no_sats_after_ttff__hint: Чи було втрачено видимість GPS-супутників після першого
      фіксу (TTFF). Може вказувати на проблеми з GPS-антеною.
    inhibit_gps: Не довіряти GPS
    inhibit_gps__hint: Чи ігнорується внутрішній GPS тарілки на користь альтернативного
      джерела місцезнаходження.
    pnt_filter_convergence_state: Стан фільтра позиціонування

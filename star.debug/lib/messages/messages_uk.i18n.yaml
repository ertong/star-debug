    stableConnection_hint: Термінал отримав стабільне з'єднання за мережею.
  DishConfig:
    snow_melt_mode: Snow melt mode
    snow_melt_mode__hint: 'Можливі варіанти:


      - **AUTO** - Тарілка автоматично розтоплює сніг при виявленні.

      - **ALWAYS_ON** - Нагрівач для танення снігу завжди увімкнений.

      - **ALWAYS_OFF** - Нагрівач для танення снігу завжди вимкнений.

      '
    location_request_mode: Location request mode
    location_request_mode__hint: "Можливі варіанти:\n - **NONE** - Starlink не публікує\
      \ своє місцезнаходження в локальну мережу.\n - **LOCAL** - Starlink публікує\
      \ своє місцезнаходження локальній мережі через DHCP та API.\n\nЩоб змінити це\
      \ налаштування, вам потрібний оригінальний додаток Starlink з залогіненим обліковим\
      \ записом,\nдоступом до Інтернету та доступом до Starlink. Ви можете знайти\
      \ це налаштування в\n*Advanced* -> *Debug Data* -> *Allow access on local network*.\n"
    level_dish_mode: Level dish mode
    level_dish_mode__hint: 'Можливі варіанти:


      - **TILT_LIKE_NORMAL** - Тарілка нахиляється як зазвичай для відстеження супутників.

      - **FORCE_LEVEL** - Тарілка примусово залишається рівною (горизонтально).

      '
    power_save_start_minutes: Power save start minutes
    power_save_duration_minutes: Power save duration minutes
    power_save_mode: Power save mode
    power_save_mode__hint: Для Starlink можна налаштувати режим сну. Starlink не надає

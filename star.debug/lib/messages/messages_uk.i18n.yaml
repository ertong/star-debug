    firstCplane_hint: Термінал отримав перший контрольний пакет даних від супутника.
    firstPopPing: First PoP ping
    firstPopPing_hint: Термінал вперше пропінгував Point of Presence на землі.
    gpsValid: GPS valid
    gpsValid_hint: GPS став валідним та видав точну позицію.
